<header class="navbar-wrapper glass-effect">
  <div class="navbar-container container-padding">
    <!-- Brand Logo -->
    <a (click)="onNavClick('home')" class="brand-logo" role="button" tabindex="0">
      <span class="brand-name">Pradeep<span class="brand-dot">.</span></span>
      <span class="brand-badge">Full Stack</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        @for (item of navItems; track item.target) {
          <li class="nav-item">
            <button 
              type="button" 
              class="nav-link" 
              [class.active]="portfolioService.activeSection() === item.target"
              (click)="onNavClick(item.target)">
              {{ item.label }}
            </button>
          </li>
        }
      </ul>
    </nav>

    <!-- Right Actions: Theme Toggle + View Resume CTA -->
    <div class="nav-actions">
      <!-- Theme Switcher Button -->
      <button 
        type="button" 
        class="theme-toggle-btn" 
        (click)="toggleTheme()" 
        [attr.aria-label]="'Switch to ' + (portfolioService.currentTheme() === 'dark' ? 'light' : 'dark') + ' mode'"
        title="Toggle Theme">
        @if (portfolioService.currentTheme() === 'dark') {
          <!-- Sun Icon for switching to light mode -->
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Moon Icon for switching to dark mode -->
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        }
      </button>

      <!-- View Resume Button -->
      <a 
        [href]="portfolioService.profile().resumeUrl" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="resume-cta-btn" 
        title="View Resume PDF">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span>View Resume</span>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button 
        type="button" 
        class="mobile-menu-toggle" 
        (click)="toggleMobileMenu()" 
        aria-label="Toggle Navigation Menu">
        @if (isMobileMenuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation Menu -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-menu-dropdown container-padding">
      <ul class="mobile-nav-list">
        @for (item of navItems; track item.target) {
          <li class="mobile-nav-item">
            <button 
              type="button" 
              class="mobile-nav-link" 
              [class.active]="portfolioService.activeSection() === item.target"
              (click)="onNavClick(item.target)">
              {{ item.label }}
            </button>
          </li>
        }
        <li class="mobile-nav-item mobile-cta-item">
          <a 
            [href]="portfolioService.profile().resumeUrl" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="btn-primary mobile-resume-btn" 
            (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>View Resume PDF</span>
          </a>
        </li>
      </ul>
    </div>
  }
</header>
